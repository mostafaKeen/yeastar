services:
  yeastar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yeastar_pbx_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VIRTUAL_HOST=yeastar.keenenter.com
      - LETSENCRYPT_HOST=yeastar.keenenter.com
      - VIRTUAL_PORT=80
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://yeastar.keenenter.com
      - DB_CONNECTION=mysql
      - DB_HOST=yeastar-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-yeastar_production}
      - DB_USERNAME=${DB_USERNAME:-yeastar_user}
      - DB_PASSWORD=${DB_PASSWORD:-YeastarSecurePass2026!}
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=yeastar-redis
      - REDIS_PORT=6379
    volumes:
      - ./.env:/var/www/html/.env
      - yeastar_app_storage:/var/www/html/storage
      - yeastar_app_uploads:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - yeastar_internal
      - web
    depends_on:
      yeastar-db:
        condition: service_healthy
      yeastar-redis:
        condition: service_started

  yeastar-db:
    image: mysql:8.0
    container_name: yeastar_pbx_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-yeastar_production}
      MYSQL_USER: ${DB_USERNAME:-yeastar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-YeastarSecurePass2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-YeastarRootPass2026!}
    volumes:
      - yeastar_db_data:/var/lib/mysql
    networks:
      - yeastar_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-YeastarRootPass2026!}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  yeastar-redis:
    image: redis:7-alpine
    container_name: yeastar_pbx_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - yeastar_redis_data:/data
    networks:
      - yeastar_internal

networks:
  yeastar_internal:
    driver: bridge
  web:
    external: true

volumes:
  yeastar_db_data:
    name: yeastar_pbx_db_data
  yeastar_redis_data:
    name: yeastar_pbx_redis_data
  yeastar_app_storage:
    name: yeastar_pbx_app_storage
  yeastar_app_uploads:
    name: yeastar_pbx_app_uploads
